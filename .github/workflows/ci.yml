name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:test-public
      - run: npm run security:check-public
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  database-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run db:test:location-upgrade
      - run: npm run db:test:account-deletion-upgrade
      - run: npm run db:test:reviewer-upgrade
      - if: always()
        run: npx supabase stop --no-backup

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:test:concurrency
      - run: npm run db:test:reviewer-concurrency
      - run: npm run build
      - run: npm run api:test:account-deletion
      - run: npm run api:test:auth-email-confirmation
      - run: npm run api:test:personal-card
      - run: npm run api:test:share-retro
      - run: npm run api:test:localized-read
      - run: npm run api:test:location-compliance
      - run: npm run api:test:reviewer-access
      - run: npm run db:lint
      - run: npm run db:advisors
      - if: always()
        run: npx supabase stop --no-backup
