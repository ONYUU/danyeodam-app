name: Mobile CI

on:
  # Branch protection requires the mobile job, so every pull request must create it.
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "tools/eas-cli/**"
      - ".github/workflows/mobile-ci.yml"
      - "eslint.config.mjs"
      - "scripts/check-public-repo-safety.mjs"
      - "scripts/lib/public-repo-safety.mjs"
      - "scripts/test-public-repo-safety.mjs"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            tools/eas-cli/package-lock.json
      - name: Verify public repository safety before dependency installation
        working-directory: .
        run: node scripts/check-public-repo-safety.mjs
      - name: Activate the pinned npm version through Corepack
        run: |
          corepack enable
          test "$(node --version)" = "v24.19.0"
          test "$(corepack npm --version)" = "11.16.0"
      - run: corepack npm ci --strict-allow-scripts
      - name: Verify the lockfile-bound EAS release tool
        working-directory: .
        run: |
          corepack npm --prefix tools/eas-cli ci --strict-allow-scripts
          version="$(corepack npm --offline --prefix tools/eas-cli run --silent eas -- --version)"
          case "$version" in
            eas-cli/22.2.0*) ;;
            *) echo "Unexpected EAS CLI version" >&2; exit 1 ;;
          esac
      - run: corepack npm run check
      - run: corepack npm run config:assert:production
      - name: Verify production bundle generation without asserting release approval
        run: corepack npm run export:production:verify
