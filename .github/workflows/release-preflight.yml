name: Public code release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mobile-release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
            tools/eas-cli/package-lock.json
      - name: Activate the pinned npm version through Corepack
        run: |
          corepack enable
          test "$(node --version)" = "v24.19.0"
          test "$(corepack npm --version)" = "11.16.0"
      - name: Install application dependencies
        run: corepack npm ci --strict-allow-scripts
      - name: Install mobile dependencies
        run: corepack npm --prefix apps/mobile ci --strict-allow-scripts
      - name: Install and verify the lockfile-bound EAS release tool
        run: |
          corepack npm --prefix tools/eas-cli ci --strict-allow-scripts
          version="$(corepack npm --offline --prefix tools/eas-cli run --silent eas -- --version)"
          case "$version" in
            eas-cli/22.2.0*) ;;
            *) echo "Unexpected EAS CLI version" >&2; exit 1 ;;
          esac
      - name: Verify the public repository boundary
        run: corepack npm run security:test-public && corepack npm run security:check-public
      - name: Verify the web application
        run: corepack npm test && corepack npm run typecheck && corepack npm run lint && corepack npm run build
      - name: Verify the mobile release configuration
        run: corepack npm --prefix apps/mobile run check && corepack npm --prefix apps/mobile run config:assert:production
      - name: Verify production bundle generation
        run: corepack npm --prefix apps/mobile run export:production:verify
      - name: Explain the private approval boundary
        run: echo "Signed store builds additionally require DANYEODAM_RELEASE_APPROVAL_FILE in EAS."
